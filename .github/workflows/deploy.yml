name: Preparer le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le site
        run: |
          mkdir out
          unzip -q site-deuxrives.zip -d out
          sed -i 's|Hébergeur&nbsp;: OVH SAS, 2 rue Kellermann, 59100 Roubaix, France.|Hébergeur\&nbsp;: OVH SAS, 2 rue Kellermann, 59100 Roubaix, France. Tél.\&nbsp;: +33\&nbsp;9\&nbsp;72\&nbsp;10\&nbsp;10\&nbsp;07.|' out/index.html
          grep -q '+33&nbsp;9&nbsp;72' out/index.html
      - name: Publier sur la branche site
        run: |
          cd out
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site Deux Rives Hospitality"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
