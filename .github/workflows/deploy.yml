name: Preparer le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le site
        run: |
          mkdir out
          unzip -q site-deuxrives.zip -d out
          grep -q '4820' out/index.html || sed -i 's|San Francisco, CA 94107, États-Unis.|San Francisco, CA 94107, États-Unis. Tél.\&nbsp;: +1\&nbsp;877\&nbsp;448\&nbsp;4820.|' out/index.html
          grep -q 'GitHub, Inc.' out/index.html
          [ -f out/CNAME ] || echo www.deuxriveshospitality.com > out/CNAME
          touch out/.nojekyll
      - name: Publier sur la branche site
        run: |
          cd out
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site Deux Rives Hospitality"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
